name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: Apple Silicon
    runs-on: ${{ matrix.platform }}
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Run CI assertions
        run: |
          chmod +x scripts/ci-checks.sh
          CI_SKIP_CARGO_TEST=1 CI_SKIP_NPM_CHECK=1 scripts/ci-checks.sh

      - name: Build frontend
        # Required before cargo test: tauri::generate_context!() validates that
        # frontendDist (../dist) exists at compile time, even for the lib build.
        run: npm run build

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --no-default-features --features custom-protocol,llm-cleanup

      - name: Frontend type check
        run: npm run check

      - name: Audit Rust dependencies
        working-directory: src-tauri
        run: |
          cargo install cargo-audit --quiet
          # RUSTSEC-2026-0097: rand 0.9.x unsound with custom loggers — not applicable,
          #   transitive via tokenizers -> parakeet-rs
          # RUSTSEC-2026-0098/0099/0104: rustls-webpki certificate validation issues —
          #   transitive via Tauri/Wry, fixed in newer rustls but not yet pulled by Wry
          cargo audit \
            --ignore RUSTSEC-2026-0097 \
            --ignore RUSTSEC-2026-0098 \
            --ignore RUSTSEC-2026-0099 \
            --ignore RUSTSEC-2026-0104

      - name: Audit npm dependencies
        run: npm audit --omit=dev || true

      - name: Import Apple Developer Certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo $APPLE_CERTIFICATE | base64 --decode > certificate.p12
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12

      - name: Verify signing certificate
        run: |
          CERT_INFO=$(security find-identity -v -p codesigning build.keychain \
            | grep "Developer ID Application")
          echo "$CERT_INFO"
          CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
          echo "CERT_ID=$CERT_ID" >> $GITHUB_ENV

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          # Extract lines between this version's header and the next ## header.
          CHANGELOG=$(awk "/^## \[${VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md)
          echo "content<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build and release
        # v0 is the latest major for Tauri v2 — auto-updates within 0.x
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.CERT_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Do NOT set RUSTFLAGS here — it overrides .cargo/config.toml rustflags
          # which contain critical -rpath entries for Swift runtime resolution.
          # The Swift compat library -L search path lives in .cargo/config.toml.
        with:
          tagName: v__VERSION__
          releaseName: 'SottoASR v__VERSION__'
          releaseBody: |
            ## What's New

            ${{ steps.changelog.outputs.content }}

            ---

            ### Installation

            1. Download `SottoASR___VERSION___aarch64.dmg` below
            2. Open the DMG and drag SottoASR to Applications
            3. Launch SottoASR — it will appear in your menu bar
            4. On first launch, ~500 MB of speech recognition models will be downloaded automatically
            5. Grant Accessibility and Input Monitoring permissions when prompted

            ### Requirements

            - macOS 14 Sonoma or later
            - Apple Silicon (M1 or later)
            - Python 3.10+ (only required for optional AI Transcript Cleanup feature)

            This build is signed and notarized by Apple.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
