name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: Apple Silicon
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Sotto v__VERSION__'
          releaseBody: |
            ## Sotto v__VERSION__

            Local, privacy-first speech-to-text for macOS.

            ### Installation

            1. Download `Sotto___VERSION___aarch64.dmg` below
            2. Open the DMG and drag Sotto to Applications
            3. Launch Sotto — it will appear in your menu bar
            4. On first launch, ~500 MB of speech recognition models will be downloaded automatically
            5. Grant Accessibility and Input Monitoring permissions when prompted

            ### Requirements

            - macOS 14 Sonoma or later
            - Apple Silicon (M1 or later)
            - Python 3.10+ (only required for optional AI Transcript Cleanup feature)

            > **Note:** This is an unsigned build. On first launch, right-click the app and select "Open" to bypass Gatekeeper.

            See [CHANGELOG.md](https://github.com/juanqui/sotto/blob/main/CHANGELOG.md) for details.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
