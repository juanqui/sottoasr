name: Build & Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: Create a draft release (otherwise only verify and upload artifacts)
        type: boolean
        default: false

concurrency:
  group: signed-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: Apple Silicon
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Nothing pushes: tauri-action calls the API with GITHUB_TOKEN and the
          # release-target check reads public tags with git ls-remote and gh.
          persist-credentials: false

      - name: Verify release target
        if: github.event_name != 'workflow_dispatch' || inputs.create_release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: python3 scripts/check-release-target.py

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install verified Rust 1.96.0
        uses: dtolnay/rust-toolchain@3cfd829add0beb9cf7406e52147d74ad3db19d01 # 1.96.0 branch
        with:
          targets: ${{ matrix.target }}
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Run CI assertions
        run: bash scripts/ci-checks.sh

      - name: Build frontend
        # Required before cargo test: tauri::generate_context!() validates that
        # frontendDist (../dist) exists at compile time, even for the lib build.
        run: npm run build

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Rust lint
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Frontend tests
        run: npm test

      - name: Python protocol tests
        run: |
          python3 -m unittest discover -s src-tauri/sidecar -p 'test_*.py'
          python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Frontend type check
        run: npm run check

      - name: Audit Rust dependencies
        working-directory: src-tauri
        run: |
          # .cargo/audit.toml ignores the zip advisories only because zip is not built for macOS.
          if ! grep -qx 'name = "zip"' Cargo.lock; then
            echo "::notice::zip is no longer in Cargo.lock. Delete its ignores from src-tauri/.cargo/audit.toml and the zip checks in .github/workflows and scripts/pre-release-check.sh."
          else
            ZIP_DEPENDENTS=$(cargo tree --locked -i zip --target aarch64-apple-darwin)
            if [ -n "$ZIP_DEPENDENTS" ]; then
              echo "$ZIP_DEPENDENTS"
              echo "::error::zip is now built for aarch64-apple-darwin, so the zip ignores in src-tauri/.cargo/audit.toml no longer hold. Update zip and remove them."
              exit 1
            fi
          fi
          cargo install cargo-audit --version 0.22.2 --locked --quiet
          cargo audit

      - name: Audit npm dependencies
        run: npm audit --omit=dev

      - name: Import Apple Developer Certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12

      - name: Verify signing certificate
        run: |
          CERT_INFO=$(security find-identity -v -p codesigning build.keychain \
            | grep "Developer ID Application")
          echo "$CERT_INFO"
          CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
          echo "CERT_ID=$CERT_ID" >> $GITHUB_ENV

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          # Extract lines between this version's header and the next ## header.
          CHANGELOG=$(awk "/^## \[${VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md)
          echo "content<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build and release
        # Keep the established v0 action contract; PR CI exercises the same action.
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.CERT_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Do NOT set RUSTFLAGS here — it overrides .cargo/config.toml rustflags
          # which contain critical -rpath entries for Swift runtime resolution.
          # The Swift compat library -L search path lives in .cargo/config.toml.
        with:
          tagName: ${{ (github.event_name != 'workflow_dispatch' || inputs.create_release) && 'v__VERSION__' || '' }}
          releaseCommitish: ${{ github.sha }}
          releaseName: 'SottoASR v__VERSION__'
          releaseBody: |
            ## What's New

            ${{ steps.changelog.outputs.content }}

            ---

            ### Installation

            1. Download `SottoASR___VERSION___aarch64.dmg` below
            2. Open the DMG and drag SottoASR to Applications
            3. Launch SottoASR — it will appear in your menu bar
            4. On first launch, about 630 MB of speech recognition models will be downloaded automatically
            5. Grant Microphone and Accessibility access when prompted

            ### Requirements

            - macOS 14 Sonoma or later
            - Apple Silicon (M1 or later)
            - Optional AI Transcript Cleanup: about 1.4 GB for the cleanup model, plus its Python runtime. If no native arm64 Python 3.11 to 3.14 is installed, SottoASR downloads its own Python.

            This build is signed and notarized by Apple.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Upload verified macOS packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-macos-${{ github.sha }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz*
          if-no-files-found: error
          retention-days: 14
