[package]
name = "sottoasr"
version = "0.13.0"
description = "SottoASR — Local-first, privacy-first speech-to-text for macOS"
authors = ["Juan Villa <juan@villafam.com>"]
license = "MIT"
repository = "https://github.com/juanqui/sottoasr"
edition = "2021"
rust-version = "1.94.1"

[lib]
name = "sottoasr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [
  "tray-icon",
  "macos-private-api",
  "image-png",
] }
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }

# Audio capture. 0.16 is the first release whose disconnect listener holds the
# stream weakly; with 0.15.3 a device opened from `input_devices()` kept
# running after the stream was dropped.
cpal = "0.16"
hound = "3.5"
# Resampling to 16 kHz, for the ONNX backend and for AWS Transcribe
rubato = "0.16"

# ASR backends (selected via features)
# FluidAudio: CoreML with CPU/Neural Engine execution on Apple Silicon
fluidaudio-rs = { path = "vendor/fluidaudio-rs", optional = true }
# parakeet-rs: ONNX Runtime, cross-platform CPU fallback
parakeet-rs = { version = "0.3", optional = true }

# HTTP client and SHA-256 for model downloads (parakeet-rs)
reqwest = { version = "0.12", features = ["stream"], optional = true }
sha2 = { version = "0.10", optional = true }

# AWS Transcribe and Amazon Bedrock: the optional cloud speech engine and the
# optional cloud cleanup engine. The SDK's default HTTPS client builds aws-lc;
# this app already links ring through rustls, so the client is built with
# ring and the SDK defaults are off.
aws-config = { version = "1.13", default-features = false, features = ["rt-tokio", "credentials-process", "sso"] }
aws-sdk-transcribestreaming = { version = "1.129", default-features = false, features = ["rt-tokio"] }
aws-sdk-bedrockruntime = { version = "1.157", default-features = false, features = ["rt-tokio"] }
aws-smithy-http-client = { version = "1.5", features = ["default-client", "rustls-ring"] }
# The error type of a credential provider, to give each cause its own message
aws-credential-types = "1.3"
# File system and environment types of the profile loader
aws-types = "1.3"
# The model-specific fields of a Bedrock Converse request
aws-smithy-types = "1.9"
# The audio event stream of a Transcribe request, the windows of a Bedrock
# batch; also model downloads (parakeet-rs)
futures-util = "0.3"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
dirs = "6"
regex = "=1.12.3"
focaccia = { version = "=1.5.0", default-features = false }
whatlang = "=0.18.0"
# libc is transitively available via core-foundation, but we depend on it
# explicitly for kill_orphan()'s SIGKILL path (src/llm/engine.rs).
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-foundation = "0.10"
arboard = "3"

[dev-dependencies]
serial_test = "3"
tempfile = "3"
# Paused-clock tests for deadlines and budgets
tokio = { version = "1", features = ["test-util"] }
# The hash of the cleanup prompts that the Rust copy must have
sha2 = "0.10"

[features]
default = ["custom-protocol", "asr-fluidaudio", "llm-cleanup"]

# ASR backend selection — pick ONE
# FluidAudio: macOS only, CoreML/Apple Neural Engine, best performance
asr-fluidaudio = ["dep:fluidaudio-rs"]
# parakeet-rs: Cross-platform, ONNX Runtime CPU, wider compatibility
asr-parakeet = ["dep:parakeet-rs", "dep:reqwest", "dep:sha2"]

# Optional conservative cleanup with a stock local instruction model (Python sidecar)
llm-cleanup = []

custom-protocol = ["tauri/custom-protocol"]

[[example]]
name = "asr_fixture"
path = "examples/asr_fixture.rs"
required-features = ["asr-fluidaudio"]
